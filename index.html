<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dirty Jinx - Brass House</title>
    <meta name="description" content="Dirty Jinx — trio brass house / cave music. Deux saxophones, une batterie et des samples pour une énergie brute.">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <!-- Préchargement de l'image hero (cover plein écran) -->
    <link rel="preload" as="image" href="assets/images/jinx-hero.jpg" media="(min-width: 769px)">
    <link rel="preload" as="image" href="assets/images/jinx-about.jpg" media="(max-width: 768px)">
    <!-- Préchargement des polices auto-hébergées (déclarées en @font-face dans style.css) -->
    <link rel="preload" href="assets/fonts/inter.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="assets/fonts/syne.woff2" as="font" type="font/woff2" crossorigin>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="assets/favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="assets/favicon/favicon.svg" />
    <link rel="shortcut icon" href="assets/favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="assets/favicon/apple-touch-icon.png" />
    <link rel="manifest" href="assets/favicon/site.webmanifest" />
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navigation -->
    <nav class="nav" id="nav">
        <div class="nav-inner">
            <a href="#hero" class="nav-logo" aria-label="Dirty Jinx — accueil">
                <img src="assets/images/logo_eye_white.png" alt="Dirty Jinx">
            </a>
            <ul class="nav-links" id="navLinks">
                <li><a href="#about">À propos</a></li>
                <li><a href="#concerts">Concerts</a></li>
                <li><a href="#gallery">Galerie</a></li>
                <li><a href="#musicians">Musiciens</a></li>
                <li><a href="#contact" class="nav-cta">Contact</a></li>
            </ul>
            <button class="nav-burger" id="navBurger" aria-label="Menu" aria-expanded="false">
                <i class="bi bi-list"></i>
            </button>
        </div>
    </nav>

    <!-- Section: Hero -->
    <header id="hero" class="hero">
        <div class="hero-bg" aria-hidden="true"></div>
        <picture>
            <source media="(max-width: 768px)" srcset="assets/images/jinx-about.jpg">
            <img class="hero-image" src="assets/images/jinx-hero.jpg" alt="Dirty Jinx en session dans une friche taguée" fetchpriority="high">
        </picture>
        <div class="hero-overlay"></div>
        <div class="hero-content">
            <img src="assets/images/logo_white.png" alt="Dirty Jinx" class="hero-logo" id="heroLogo">
            <a href="#concerts" class="btn btn-primary hero-cta">
                <i class="bi bi-calendar-event"></i>
                Prochaines dates
            </a>
        </div>
    </header>

    <!-- Section 1: À propos -->
    <section id="about" class="section about">
        <div class="container about-inner">
            <div class="section-head reveal">
                <p class="section-eyebrow" id="aboutEyebrow"></p>
                <h2 class="section-title" id="aboutTitle"></h2>
            </div>
            <p class="about-text reveal reveal-delay-1" id="aboutText"></p>
            <div class="socials-badges reveal reveal-delay-2" id="aboutSocials"></div>
        </div>
    </section>

    <!-- Section 2: Concerts -->
    <section id="concerts" class="section concerts">
        <div class="container">
            <div class="section-head reveal">
                <p class="section-eyebrow" id="concertsEyebrow"></p>
                <h2 class="section-title" id="concertsTitle"></h2>
            </div>
            <div class="concerts-tabs reveal reveal-delay-1">
                <button class="tab-btn active" data-tab="upcoming">
                    À venir <span class="tab-count" id="upcomingCount">0</span>
                </button>
                <button class="tab-btn" data-tab="past">
                    Passés <span class="tab-count" id="pastCount">0</span>
                </button>
            </div>
            <div class="concerts-panel reveal reveal-delay-2">
                <ul class="concerts-list" id="upcomingList"></ul>
                <ul class="concerts-list is-hidden" id="pastList"></ul>
            </div>
        </div>
    </section>

    <!-- Section 3: Galerie -->
    <section id="gallery" class="section gallery">
        <div class="container">
            <div class="section-head reveal">
                <p class="section-eyebrow" id="galleryEyebrow"></p>
                <h2 class="section-title" id="galleryTitle"></h2>
            </div>
        </div>
        <div class="carousel reveal reveal-delay-1">
            <button class="carousel-arrow carousel-prev" id="carouselPrev" aria-label="Précédent">
                <i class="bi bi-chevron-left"></i>
            </button>
            <div class="carousel-track" id="carouselTrack"></div>
            <button class="carousel-arrow carousel-next" id="carouselNext" aria-label="Suivant">
                <i class="bi bi-chevron-right"></i>
            </button>
        </div>
    </section>

    <!-- Section 4: Musiciens -->
    <section id="musicians" class="section musicians">
        <div class="container">
            <div class="section-head reveal">
                <p class="section-eyebrow" id="musiciansEyebrow"></p>
                <h2 class="section-title" id="musiciansTitle"></h2>
            </div>
            <div class="musicians-grid" id="musiciansGrid"></div>
        </div>
    </section>

    <!-- Section 5: Contact -->
    <section id="contact" class="section contact">
        <div class="container contact-inner">
            <div class="section-head reveal">
                <p class="section-eyebrow" id="contactEyebrow"></p>
                <h2 class="section-title" id="contactTitle"></h2>
            </div>
            <p class="contact-text reveal reveal-delay-1" id="contactText"></p>

            <div class="contact-body">
                <form class="contact-form reveal reveal-delay-1" id="contactForm">
                    <div class="form-group">
                        <label for="cfName">Nom</label>
                        <input type="text" id="cfName" name="name" required placeholder="Votre nom">
                    </div>
                    <div class="form-group">
                        <label for="cfEmail">Email</label>
                        <input type="email" id="cfEmail" name="email" required placeholder="vous@exemple.com">
                    </div>
                    <div class="form-group">
                        <label for="cfMessage">Message</label>
                        <textarea id="cfMessage" name="message" rows="5" required placeholder="Parlez-nous de votre projet, date, lieu…"></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">Envoyer le message</button>
                </form>

                <aside class="contact-channels reveal reveal-delay-2">
                    <a class="contact-channel" id="contactEmailLink" href="#">
                        <span class="contact-icon"><i class="bi bi-envelope-fill"></i></span>
                        <span class="contact-channel-text">
                            <span class="contact-channel-label">Email</span>
                            <span class="contact-channel-value" id="contactEmail"></span>
                        </span>
                    </a>
                    <a class="contact-channel" id="contactPhoneLink" href="#">
                        <span class="contact-icon"><i class="bi bi-telephone-fill"></i></span>
                        <span class="contact-channel-text">
                            <span class="contact-channel-label">Téléphone</span>
                            <span class="contact-channel-value" id="contactPhone"></span>
                        </span>
                    </a>
                    <div class="socials-grid" id="contactSocials"></div>
                </aside>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container footer-inner">
            <img src="assets/images/logo_eye_white.png" alt="Dirty Jinx" class="footer-logo" id="footerLogo">
            <p class="footer-copy">&copy; 2026 <span id="footerBandName">Dirty Jinx</span>. Tous droits réservés.</p>
            <nav class="footer-links" aria-label="Ressources presse">
                <a href="socials.html">Réseaux sociaux</a>
                <span class="footer-sep" aria-hidden="true"></span>
                <a href="medias/qr/socials.png" target="_blank" rel="noopener">QR</a>
                <span class="footer-sep" aria-hidden="true"></span>
                <a href="medias/visitCard/" target="_blank" rel="noopener">Carte de visite</a>
                <span class="footer-sep" aria-hidden="true"></span>
                <a href="medias/epk/" target="_blank" rel="noopener">EPK</a>
                <span class="footer-sep" aria-hidden="true"></span>
                <a href="medias/technicalDocument/" target="_blank" rel="noopener">Fiche technique</a>
                <span class="footer-sep" aria-hidden="true"></span>
                <a href="medias/artistDocument/" target="_blank" rel="noopener">Dossier artistique</a>
            </nav>
        </div>
    </footer>

    <!-- Modale média (vanilla, fullscreen) -->
    <div class="media-modal" id="mediaModal" aria-hidden="true">
        <button class="media-modal-close" id="mediaModalClose" aria-label="Fermer">
            <i class="bi bi-x-lg"></i>
        </button>
        <div class="media-modal-content" id="mediaModalContent"></div>
    </div>

    <!-- Custom JS -->
    <script src="script.js"></script>

    <!-- GoatCounter — suivi de visites privé (sans cookie) -->
    <script data-goatcounter="https://dirtyjinx.goatcounter.com/count"
            async src="//gc.zgo.at/count.js"></script>
</body>
</html>
